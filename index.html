const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ---------------- utilities ---------------- */

function rubberband(overshoot, dimension, constant=0.55){
  return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot));
}

function hexToRgb(hex){
  const v = hex.replace('#','');
  return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');
}
function lerpColor(hexA, hexB, t){
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t);
}

const COLD = { c1:'#0A1628', c2:'#1E5F8C', c3:'#7DD3FC' };
const WARM = { c1:'#7C2D12', c2:'#EA580C', c3:'#FBBF24' };

function applyTemp(t){ // t: 0(cold)-100(warm)
  const k = Math.max(0, Math.min(100, t))/100;
  const c1 = lerpColor(COLD.c1, WARM.c1, k);
  const c2 = lerpColor(COLD.c2, WARM.c2, k);
  const c3 = lerpColor(COLD.c3, WARM.c3, k);
  const root = document.documentElement.style;
  root.setProperty('--c1', c1);
  root.setProperty('--c2', c2);
  root.setProperty('--c3', c3);
  root.setProperty('--temp', t);
}

function useReveal(){
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const kids = el.querySelectorAll('.reveal');
    const targets = kids.length ? kids : [el];
    const io = new IntersectionObserver((entries)=>{
      entries.forEach((entry, i)=>{
        if(entry.isIntersecting){
          const idx = Array.prototype.indexOf.call(targets, entry.target);
          entry.target.style.transitionDelay = (Math.max(idx,0)*60) + 'ms';
          entry.target.classList.add('reveal-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold:0.15 });
    targets.forEach(t=>io.observe(t));
    return ()=>io.disconnect();
  },[]);
  return ref;
}

function useCounter(target, active, opts={}){
  const [val, setVal] = useState(0);
  useEffect(()=>{
    if(!active) return;
    let raf, start;
    const dur = opts.duration || 1600;
    const step = (ts)=>{
      if(!start) start = ts;
      const p = Math.min(1, (ts-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      setVal(target*eased);
      if(p<1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[active, target]);
  return val;
}

function useInView(threshold=0.4){
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(()=>{
    const el = ref.current;
    if(!el) return;
    const io = new IntersectionObserver(([entry])=>{
      if(entry.isIntersecting){ setInView(true); io.disconnect(); }
    }, { threshold });
    io.observe(el);
    return ()=>io.disconnect();
  },[]);
  return [ref, inView];
}

function useHashRoute(){
  const [hash, setHash] = useState(window.location.hash || '#/');
  useEffect(()=>{
    const onHash = ()=> setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return ()=>window.removeEventListener('hashchange', onHash);
  },[]);
  return hash;
}

function Magnetic({ children, className, as:Comp='button', ...rest }){
  const ref = useRef(null);
  const offset = useRef({ x:0, y:0 });
  const pressed = useRef(false);
  const apply = ()=>{
    const el = ref.current; if(!el) return;
    const { x, y } = offset.current;
    // press feedback lives on pointer-down, composed into the same transform as the magnetic follow
    el.style.transform = `translate(${x}px, ${y}px) scale(${pressed.current ? 0.96 : 1})`;
  };
  const onMove = (e)=>{
    const el = ref.current; if(!el) return;
    const r = el.getBoundingClientRect();
    const mx = e.clientX - (r.left + r.width/2);
    const my = e.clientY - (r.top + r.height/2);
    const dist = Math.sqrt(mx*mx+my*my);
    const radius = 70;
    offset.current = dist < radius*2.2
      ? { x: mx*0.35*Math.max(0, 1 - dist/(radius*2.2)), y: my*0.35*Math.max(0, 1 - dist/(radius*2.2)) }
      : { x:0, y:0 };
    apply();
  };
  const onLeave = ()=>{ offset.current = { x:0, y:0 }; pressed.current = false; apply(); };
  const onDown = ()=>{ pressed.current = true; apply(); };
  const onUp = ()=>{ pressed.current = false; apply(); };
  return (
    <Comp ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}
      onMouseDown={onDown} onMouseUp={onUp} onTouchStart={onDown} onTouchEnd={onUp}
      className={"magnetic "+(className||'')} {...rest}>
      {children}
    </Comp>
  );
}

          fill="url(#waveGrad)">
          <animate attributeName="d" dur="10s" repeatCount="indefinite"
            values="M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1150,55 1200,40 L1200,80 L0,80 Z;
                    M0,40 C150,65 300,15 450,40 C600,65 750,15 900,40 C1050,65 1150,25 1200,40 L1200,80 L0,80 Z;
                    M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1150,55 1200,40 L1200,80 L0,80 Z" />

/* ---------------- thermostat dial ---------------- */

function ThermostatDial({ temp, setTemp }){
  const ref = useRef(null);
  const dragging = useRef(false);
  const [pressed, setPressed] = useState(false);
  const [settling, setSettling] = useState(false);

  const angleFromEvent = (clientX, clientY)=>{
    const el = ref.current; if(!el) return null;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    let deg = Math.atan2(clientY-cy, clientX-cx) * 180/Math.PI; // -180..180, 0 = right
    deg = deg + 90; // 0 at top
    if(deg < 0) deg += 360;
    // usable arc: 270deg starting at -135(top-left) through top to +135(top-right); map full 360 minus 90 bottom gap
    // simplify: map full circle, but block bottom 60deg dead zone
    return deg;
  };

  const setFromAngle = (deg)=>{
    // widen the raw input range slightly so there's room to feel the rubber-band before the hard input limit
    let usable = deg;
    if(usable > 345) usable = 345;
    if(usable < 15) usable = 15;
    let pct = ((usable-30)/300)*100;
    // soft resistance past the ends instead of a hard stop — real things slow before they stop
    // (reduced motion drops the elastic overshoot in favor of a plain clamp)
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduced){
      pct = Math.max(0, Math.min(100, pct));
    } else {
      if(pct < 0) pct = -rubberband(-pct, 45, 0.6);
      if(pct > 100) pct = 100 + rubberband(pct-100, 45, 0.6);
    }
    setTemp(pct);
  };

  const onDown = (e)=>{ dragging.current = true; setPressed(true); setSettling(false); handleMove(e); };
  const onUp = ()=>{
    dragging.current = false;
    setPressed(false);
    setTemp(t=>{
      if(t < 0 || t > 100){
        setSettling(true);
        window.setTimeout(()=>setSettling(false), 520);
        return Math.max(0, Math.min(100, t));
      }
      return t;
    });
  };
  const handleMove = (e)=>{
    if(!dragging.current) return;
    const p = e.touches ? e.touches[0] : e;
    const deg = angleFromEvent(p.clientX, p.clientY);
    if(deg!=null) setFromAngle(deg);
  };

  useEffect(()=>{
    const move = (e)=>{ if(dragging.current){ handleMove(e); if(e.cancelable) e.preventDefault(); } };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', move, { passive:false });
    window.addEventListener('touchend', onUp);
    return ()=>{
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', onUp);
    };
  },[]);

  const clamped = Math.max(0, Math.min(100, temp));
  const knobDeg = 30 + (temp/100)*300 - 90; // convert back for CSS rotate (0deg = right in css rotate space matches atan convention roughly)
  const label = clamped < 33 ? 'Cooling' : clamped > 66 ? 'Heating' : 'Balanced';

  return (
    <div className="flex flex-col items-center select-none" aria-hidden="false">
      <div
        ref={ref}
        role="slider"
        aria-label="Comfort temperature dial, drag to shift site theme between cooling and heating"
        aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(clamped)}
        tabIndex={0}
        onKeyDown={(e)=>{
          if(e.key==='ArrowLeft'||e.key==='ArrowDown') setTemp(Math.max(0,clamped-5));
          if(e.key==='ArrowRight'||e.key==='ArrowUp') setTemp(Math.min(100,clamped+5));
        }}
        onMouseDown={onDown}
        onTouchStart={onDown}
        className={"dial-ring relative w-52 h-52 md:w-64 md:h-64 rounded-full glass cursor-grab active:cursor-grabbing flex items-center justify-center transition-transform duration-150 " + (pressed ? 'scale-[0.985]' : 'scale-100')}
        style={{ boxShadow:`0 0 60px -10px var(--c2), inset 0 0 40px -10px var(--c3)` }}
      >
        <div className="absolute inset-3 rounded-full border border-white/10"></div>
        <div className="absolute inset-6 rounded-full" style={{ background:'radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c3) 18%, transparent), transparent 70%)' }}></div>

        {/* tick marks */}
        {Array.from({length:24}).map((_,i)=>{
          const d = (i/24)*300 - 150;
          return <div key={i} className="absolute left-1/2 top-1/2 w-[2px] h-3 bg-white/15 origin-bottom"
            style={{ transform:`rotate(${d}deg) translateY(-98px)` }} />;
        })}

        {/* knob */}
        <div className={"absolute w-5 h-5 rounded-full accent-grad accent-glow " + (settling ? 'knob-settle' : '')}
          style={{ transform:`rotate(${knobDeg}deg) translate(98px) rotate(${-knobDeg}deg)` }} />

        <div className="text-center pointer-events-none">
          <div className="text-4xl md:text-5xl font-display font-bold tabular accent-text-grad">{Math.round(60 + (temp/100)*20)}°</div>
          <div className="text-[11px] tracking-[0.15em] uppercase text-white/50 mt-1">{label}</div>
        </div>
      </div>
      <p className="mt-4 text-sm text-white/50 max-w-[220px] text-center">Drag the dial — the whole site shifts with it.</p>
    </div>
  );
}

/* ---------------- hero particles ---------------- */

function HeroParticles(){
  const canvasRef = useRef(null);
  useEffect(()=>{
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    let raf; let particles = [];
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const isMobile = window.innerWidth < 768;
    const COUNT = reduced ? 0 : (isMobile ? 26 : 60);

    function resize(){
      canvas.width = canvas.offsetWidth * devicePixelRatio;
      canvas.height = canvas.offsetHeight * devicePixelRatio;
    }
    function init(){
      resize();
      particles = Array.from({length:COUNT}).map(()=>({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: (Math.random()*1.6+0.6) * devicePixelRatio,
        vx: (Math.random()*0.4+0.15) * devicePixelRatio,
        vy: (Math.random()-0.5)*0.15*devicePixelRatio,
        t: Math.random(),
      }));
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const w = canvas.width;
      particles.forEach(p=>{
        p.x += p.vx; p.y += p.vy + Math.sin(p.x*0.005)*0.15;
        if(p.x > w+20) p.x = -20;
        const frac = p.x / w; // 0 left(cold) -> 1 right(warm)
        const col = lerpColor(COLD.c3, WARM.c3, frac);
        ctx.beginPath();
        ctx.fillStyle = col;
        ctx.globalAlpha = 0.55;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      });
      raf = requestAnimationFrame(draw);
    }
    init();
    if(!reduced) draw(); else { ctx.clearRect(0,0,canvas.width,canvas.height); }
    const onResize = ()=>init();
    window.addEventListener('resize', onResize);
    return ()=>{ cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); };
  },[]);
  return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full opacity-70" aria-hidden="true" />;
}

function useParallax(strength=20){
  const ref = useRef(null);
  useEffect(()=>{
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el = ref.current;
    if(reduced || !el) return;
    let raf = null;
    const onScroll = ()=>{
      if(raf) return;
      raf = requestAnimationFrame(()=>{
        raf = null;
        const r = el.getBoundingClientRect();
        const vh = window.innerHeight || 1;
        const center = r.top + r.height/2;
        const progress = (center - vh/2) / (vh/2 + r.height/2);
        const clamped = Math.max(-1, Math.min(1, progress));
        el.style.transform = `translateY(${(-clamped*strength).toFixed(2)}px)`;
      });
    };
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
    return ()=>{ window.removeEventListener('scroll', onScroll); if(raf) cancelAnimationFrame(raf); };
  },[strength]);
  return ref;
}

/* ---------------- final CTA / booking form ---------------- */

function BookingForm(){
  const [submitted, setSubmitted] = useState(false);
  const [errors, setErrors] = useState({});
  const onSubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errs = {};
    if(!fd.get('name')) errs.name = 'Required';
    if(!/^[\d\s()+-]{7,}$/.test(fd.get('phone')||'')) errs.phone = 'Enter a valid phone number';
    if(fd.get('email') && !/^\S+@\S+\.\S+$/.test(fd.get('email'))) errs.email = 'Enter a valid email';
    if(!fd.get('address')) errs.address = 'Required';
    if(!fd.get('service')) errs.service = 'Select a service';
    setErrors(errs);
    if(Object.keys(errs).length===0) setSubmitted(true);
  };

  if(submitted){
    return (
      <div className="rounded-2xl glass p-10 text-center">
        <div className="w-14 h-14 rounded-full accent-grad flex items-center justify-center text-2xl mx-auto mb-4">✓</div>
        <h3 className="font-display font-bold text-2xl mb-2">Request received.</h3>
        <p className="text-white/60">A dispatcher will call you shortly to confirm your appointment window. For anything urgent, call us directly at {PHONE_DISPLAY}.</p>
      </div>
    );
  }

  const field = "w-full rounded-xl border border-white/15 px-4 py-3 text-sm placeholder:text-white/35 focus:border-white/40 transition";

  return (
    <form onSubmit={onSubmit} noValidate className="rounded-2xl glass p-7 md:p-9 grid gap-4">
      <div className="grid sm:grid-cols-2 gap-4">
        <div>
          <label htmlFor="name" className="text-xs text-white/60 mb-1.5 block">Full name</label>
          <input id="name" name="name" className={field} placeholder="Jane Rivera" />
          {errors.name && <p className="text-red-400 text-xs mt-1">{errors.name}</p>}
        </div>
        <div>
          <label htmlFor="phone" className="text-xs text-white/60 mb-1.5 block">Phone</label>
          <input id="phone" name="phone" className={field} placeholder="(201) 555-0134" />
          {errors.phone && <p className="text-red-400 text-xs mt-1">{errors.phone}</p>}
        </div>
      </div>
      <div>
        <label htmlFor="email" className="text-xs text-white/60 mb-1.5 block">Email (optional)</label>
        <input id="email" name="email" type="email" className={field} placeholder="jane@email.com" />
        {errors.email && <p className="text-red-400 text-xs mt-1">{errors.email}</p>}
      </div>
      <div>
        <label htmlFor="address" className="text-xs text-white/60 mb-1.5 block">Service address</label>
        <input id="address" name="address" className={field} placeholder="123 Grove St, Jersey City, NJ" />
        {errors.address && <p className="text-red-400 text-xs mt-1">{errors.address}</p>}
      </div>
      <div>
        <label htmlFor="service" className="text-xs text-white/60 mb-1.5 block">Service type</label>
        <select id="service" name="service" defaultValue="" className={field}>
          <option value="" disabled>Select a service</option>
          {SERVICES.map(s=> <option key={s.slug} value={s.name}>{s.name}</option>)}
          <option value="Not sure">Not sure yet</option>
        </select>
        {errors.service && <p className="text-red-400 text-xs mt-1">{errors.service}</p>}
      </div>
      <div>
        <label htmlFor="message" className="text-xs text-white/60 mb-1.5 block">What's going on? (optional)</label>
        <textarea id="message" name="message" rows="3" className={field} placeholder="No heat since last night, thermostat reads 58°..."></textarea>
      </div>
      <Magnetic as="button" type="submit" className="mt-2 rounded-full accent-grad text-[#080C14] font-display font-semibold py-3.5 accent-glow hover:brightness-110 transition">
        Request My Free Estimate
      </Magnetic>
      <p className="text-center text-xs text-white/40">or call us directly at <a href={PHONE_TEL} className="underline">{PHONE_DISPLAY}</a></p>
    </form>
  );
}

/* ---------------- app ---------------- */

function App(){
  const [temp, setTemp] = useState(20);
  const [loading, setLoading] = useState(true);
  const hash = useHashRoute();

  useEffect(()=>{ applyTemp(temp); },[temp]);
  useEffect(()=>{
    const t = setTimeout(()=>setLoading(false), 550);
    return ()=>clearTimeout(t);
  },[]);

  let route = { name:'home' };
  if(hash.startsWith('#/services/')) route = { name:'service', slug: hash.replace('#/services/','') };
  else if(hash.startsWith('#/areas/')) route = { name:'town', slug: hash.replace('#/areas/','') };

  return (
    <div>
      <div aria-hidden={!loading} className={"fixed inset-0 z-[100] bg-[#080C14] flex items-center justify-center transition-opacity duration-500 " + (loading ? 'opacity-100' : 'opacity-0 pointer-events-none')}>
        <div className="flex items-center gap-3">
          <span className="w-10 h-10 rounded-xl accent-grad flex items-center justify-center font-display font-bold animate-pulse">JC</span>
          <span className="font-display font-bold text-lg">Jersey City HVAC Pros</span>
        </div>
      </div>

      <Header />

      {route.name==='home' && (
        <main>
          <Hero temp={temp} setTemp={setTemp} />
          <Waveform />
          <EmergencyBand />
          <ServicesGrid />
          <Waveform flip />
          <HowItWorks />
          <TeamOnStreet />
          <StatsBand />
          <Financing />
          <LogoMarquee />
          <Testimonials />
          <ServiceArea />
          <FAQ />
          <FinalCTA />
        </main>
      )}
      {route.name==='service' && <main><ServicePage slug={route.slug} /></main>}
      {route.name==='town' && <main><TownPage slug={route.slug} /></main>}

      <Footer />
      <MobileBottomBar />
      <div className="md:hidden h-16" aria-hidden="true"></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
